version: '3.8'

services:
  postgres:
    image: postgres:15
    restart: always
    env_file: ./.env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - internal      

  rabbitmq:
    image: rabbitmq:3.9-management
    restart: always
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - internal

  backend:
    build:
      context: ./backend
    container_name: portal_backend
    restart: always
    env_file: ./.env
    depends_on:
      - postgres
      - rabbitmq
    volumes:
      - ./uploads:/app/uploads
      - ./profile_pictures:/app/profile_pictures
    networks:
      - internal

  celery_worker:
    build:
      context: ./backend
    command: celery -A backend.tasks:celery_app worker --loglevel=info
    env_file: ./.env
    depends_on:
      - rabbitmq
      - postgres
    volumes:
      - ./uploads:/app/uploads
      - ./profile_pictures:/app/profile_pictures
    networks:
      - internal

  frontend:
    build:
      context: ./frontend
    container_name: portal_frontend
    restart: always
    networks:
      - internal

  nginx:
    image: nginx:alpine
    container_name: portal_nginx
    restart: always
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "80:80"
    depends_on:
      - frontend
      - backend
    networks:
      - internal

volumes:
  postgres_data:

networks:
  internal:
    driver: bridge